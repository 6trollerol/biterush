<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Products</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 min-h-screen">
<div class="max-w-7xl mx-auto flex items-center justify-between">
</div>

<!-- Header -->
<section class="bg-gray-800 border-b border-gray-700 py-8 px-4">
<div class="relative max-w-7xl mx-auto">
<a href="index.html" class="absolute right-0 text-xl font-semibold text-gray-300 hover:text-blue-300">⬅ Back to Home</a>
<h1 class="text-4xl font-bold text-gray-300 mb-2">🛠 Manage Products</h1>
<p class="text-gray-300">Add, edit, or delete food items</p>
</div>
</section>


<!-- Add Product Form -->
<section class="max-w-7xl mx-auto p-4">
<div class="bg-gray-800 border border-gray-700 rounded-lg p-6 mb-8">
<h2 class="text-2xl text-gray-300 font-semibold mb-4">➕ Add New Product</h2>


<form id="addProductForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
<input required placeholder="Name" id="name" class="bg-gray-700 p-3 rounded border border-gray-600 text-white" />
<input required placeholder="Price" id="price" class="bg-gray-700 p-3 rounded border border-gray-600 text-white" />
<input required placeholder="Image URL" id="img" class="bg-gray-700 p-3 rounded border border-gray-600 text-white" />
<input required placeholder="Ingredients" id="ingredients" class="bg-gray-700 p-3 rounded border border-gray-600 text-white" />
<input required placeholder="Description" id="description" class="bg-gray-700 p-3 rounded border border-gray-600 text-white" />
<select id="type" class="bg-gray-700 p-3 rounded border border-gray-600 text-white">
<option value="pizza">pizza</option>
<option value="salad">salad</option>
<option value="hamburger">hamburger</option>
<option value="chicken wings">chicken wings</option>
<option value="sushi">sushi</option>
<option value="soup">soup</option>
<option value="drink">drink</option>
</select>
<button id="addProductBtn" class="md:col-span-3 bg-green-600 hover:bg-green-700 py-3 rounded font-semibold text-white">Add Product</button>
</form>
</div>
</section>


<!-- Products Table -->
<section class="max-w-7xl mx-auto p-4">
<div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
<h2 class="text-2xl text-gray-300 font-semibold mb-4">📦 Product List</h2>


<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-gray-700 text-gray-300">
<th class="p-3">Image</th>
<th class="p-3">Name</th>
<th class="p-3">Type</th>
<th class="p-3">Price</th>
<th class="p-3">Actions</th>
</tr>
</thead>
<tbody id="productTable">
</tbody>
</table>
</div>
</div>
</section>


<!-- Edit Product Modal -->
<div id="editModal" class="hidden fixed inset-0 bg-black/70 items-center justify-center z-50">
<div class="bg-gray-800 border border-gray-700 rounded-lg p-6 w-full max-w-2xl mx-4">
<h2 class="text-2xl font-semibold mb-4 text-gray-300">Edit Product</h2>

<form id="editForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
<input type="hidden" id="editId" />
<input required placeholder="Name" id="editName" class="bg-gray-700 p-3 rounded border border-gray-600 text-white" />
<input required placeholder="Price" id="editPrice" class="bg-gray-700 p-3 rounded border border-gray-600 text-white" />
<input required placeholder="Image URL" id="editImg" class="bg-gray-700 p-3 rounded border border-gray-600 text-white md:col-span-2" />
<input required placeholder="Ingredients" id="editIngredients" class="bg-gray-700 p-3 rounded border border-gray-600 text-white md:col-span-2" />
<textarea required placeholder="Description" id="editDescription" rows="3" class="bg-gray-700 p-3 rounded border border-gray-600 text-white md:col-span-2"></textarea>
<select id="editType" class="bg-gray-700 p-3 rounded border border-gray-600 text-white md:col-span-2">
<option value="pizza">pizza</option>
<option value="salad">salad</option>
<option value="hamburger">hamburger</option>
<option value="chicken wings">chicken wings</option>
<option value="sushi">sushi</option>
<option value="soup">soup</option>
<option value="drink">drink</option>
</select>
<div class="md:col-span-2 flex gap-3">
<button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 py-3 rounded font-semibold text-white">Update Product</button>
<button type="button" id="cancelEditBtn" class="flex-1 bg-gray-600 hover:bg-gray-700 py-3 rounded font-semibold text-white">Cancel</button>
</div>
</form>
</div>
</div>


<script src="./js/admin.js"></script>
</body>
</html>
