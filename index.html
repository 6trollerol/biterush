<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>

<body class="bg-gray-900 min-h-screen">
   <!-- Navigation Bar -->
   <nav class="bg-gray-800 border-b border-gray-700 px-4 py-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
         <a href="index.html" class="text-white text-xl font-semibold hover:text-gray-300 transition-colors">
            Home
         </a>
         <button id="signOutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
            Sign Out
         </button>
      </div>
   </nav>

   <!-- Website Introduction Section -->
   <section class="bg-gray-800 border-b border-gray-700 py-12 px-4">
      <div class="max-w-7xl mx-auto text-center">
         <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Find Food</h1>
         <p class="text-gray-300 text-lg md:text-xl max-w-3xl mx-auto">
            Discover a wide variety of delicious meals, from mouth-watering pizzas and juicy burgers to fresh salads, 
            flavorful sushi, and refreshing drinks. Order your favorite dishes with just a few clicks!
         </p>
      </div>
   </section>

   <!-- Product Sections Container -->
   <div class="p-4 max-w-7xl mx-auto">
      <!-- Pizza Section -->
      <section class="mb-12">
         <h2 class="text-3xl font-bold text-white mb-6 pb-2 border-b border-gray-700">🍕 Pizza</h2>
         <div class="product-container pizza-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- Salad Section -->
      <section class="mb-12">
         <h2 class="text-3xl font-bold text-white mb-6 pb-2 border-b border-gray-700">🥗 Salad</h2>
         <div class="product-container salad-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- Hamburger Section -->
      <section class="mb-12">
         <h2 class="text-3xl font-bold text-white mb-6 pb-2 border-b border-gray-700">🍔 Hamburger</h2>
         <div class="product-container hamburger-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- Chicken Wings Section -->
      <section class="mb-12">
         <h2 class="text-3xl font-bold text-white mb-6 pb-2 border-b border-gray-700">🍗 Chicken Wings</h2>
         <div class="product-container chicken-wings-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- Sushi Section -->
      <section class="mb-12">
         <h2 class="text-3xl font-bold text-white mb-6 pb-2 border-b border-gray-700">🍣 Sushi</h2>
         <div class="product-container sushi-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- Soup Section -->
      <section class="mb-12">
         <h2 class="text-3xl font-bold text-white mb-6 pb-2 border-b border-gray-700">🍲 Soup</h2>
         <div class="product-container soup-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- Drink Section -->
      <section class="mb-12">
         <h2 class="text-3xl font-bold text-white mb-6 pb-2 border-b border-gray-700">🥤 Drinks</h2>
         <div class="product-container drink-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>
   </div>
   
   <script src="./js/main.js"> </script>
   
</body>
</html>
