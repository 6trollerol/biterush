<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Food Ordering System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-4 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <a href="index.html" class="text-white text-xl font-semibold hover:text-gray-300 transition-colors">
                Home
            </a>
            <div class="flex-1"></div>
        </div>
    </nav>

    <!-- Register Section -->
    <div class="flex items-center justify-center min-h-[calc(100vh-200px)] px-4 py-12">
        <div class="w-full max-w-md">
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-white mb-2">Register</h1>
                </div>
                <form id="register-form">
                    <div class="mb-6">
                        <label for="username" class="block text-gray-300 text-sm font-medium mb-2">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Enter your username" 
                            required
                            autocomplete="username"
                            class="w-full bg-gray-700 text-white px-4 py-3 rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500 placeholder-gray-400"
                        >
                    </div>
                    <div class="mb-6">
                        <label for="email" class="block text-gray-300 text-sm font-medium mb-2">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                            autocomplete="email"
                            class="w-full bg-gray-700 text-white px-4 py-3 rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500 placeholder-gray-400"
                        >
                    </div>
                    <div class="mb-6">
                        <label for="password" class="block text-gray-300 text-sm font-medium mb-2">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required
                            autocomplete="new-password"
                            class="w-full bg-gray-700 text-white px-4 py-3 rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500 placeholder-gray-400"
                        >
                    </div>
                    <div class="mb-6">
                        <label for="confirm-password" class="block text-gray-300 text-sm font-medium mb-2">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            placeholder="Confirm your password" 
                            required
                            autocomplete="new-password"
                            class="w-full bg-gray-700 text-white px-4 py-3 rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500 placeholder-gray-400"
                        >
                    </div>
                    <button type="button" class="submit-btn w-full bg-red-600 hover:bg-red-700 text-white px-4 py-3 rounded-lg font-medium transition-colors">
                        <span>Register</span>
                    </button>
                </form>
            </div>
            <a href="./login.html" class="block text-center mt-6 text-gray-400 hover:text-gray-300 transition-colors">
                Go to login
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 mt-12 py-8 px-4">
        <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-6">
                <div>
                    <h3 class="text-white text-lg font-semibold mb-4">Find Food</h3>
                    <p class="text-gray-400">
                        Discover delicious meals and order your favorite dishes with ease.
                    </p>
                </div>
                <div>
                </div>
                <div>
                    <h3 class="text-white text-lg font-semibold mb-4">Contact Us</h3>
                    <p class="text-gray-400 mb-2">Email: email@gmail.com</p>
                    <p class="text-gray-400">Phone: 123 456 7980</p>
                </div>
            </div>
            <div class="border-t border-gray-700 pt-6 text-center">
                <p class="text-gray-400">© 2026 Find Food. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="./js/register.js"></script>
</body>
</html>
