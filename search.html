<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Find Food</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-900 min-h-screen">
   <!-- Navigation Bar -->
   <nav class="bg-gray-800 border-b border-gray-700 px-4 py-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
         <a href="index.html" class="text-white text-xl font-semibold hover:text-gray-300 transition-colors">
            Home
         </a>
         <input type="text" placeholder="Search..." class="search flex-1 max-w-md bg-gray-700 text-white px-4 py-2 rounded-lg border border-gray-600 focus:outline-none focus:border-gray-500 placeholder-gray-400">
         <button id="signOutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
            Sign Out
         </button>
      </div>
   </nav>

   <!-- Search Results Header -->
   <section class="bg-gray-800 border-b border-gray-700 py-8 px-4">
      <div class="max-w-7xl mx-auto">
         <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">Search Results</h1>
         <p id="searchQuery" class="text-gray-300 text-lg">
            Showing results for: <span class="font-semibold text-white" id="searchTerm"></span>
         </p>
         <p id="resultCount" class="text-gray-400 text-sm mt-2">
            <span id="count">0</span> product(s) found
         </p>
      </div>
   </section>

   <!-- Search Results Container -->
   <div class="p-4 max-w-7xl mx-auto">
         <!-- Search Results Grid -->
      <div id="searchResults" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
         <!-- Products will be dynamically inserted here -->
      </div>
   </div>
   
   <!-- Footer -->
   <footer class="bg-gray-800 border-t border-gray-700 mt-12 py-8 px-4">
      <div class="max-w-7xl mx-auto">
         <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-6">
            <div>
               <h3 class="text-white text-lg font-semibold mb-4">Find Food</h3>
               <p class="text-gray-400">
                  Discover delicious meals and order your favorite dishes with ease.
               </p>
            </div>
            <div>
            </div>
            <div>
               <h3 class="text-white text-lg font-semibold mb-4">Contact Us</h3>
               <p class="text-gray-400 mb-2">Email: email@gmail.com</p>
               <p class="text-gray-400">Phone: 123 456 7980</p>
            </div>
         </div>
         <div class="border-t border-gray-700 pt-6 text-center">
            <p class="text-gray-400">© 2026 Find Food. All rights reserved.</p>
         </div>
      </div>
   </footer>
   
   <script src="./js/search.js"></script>
   <script src="./js/main.js"></script>
</body>
</html>
